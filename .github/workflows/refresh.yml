name: Refresh shows

on:
  schedule:
    - cron: "0 14 * * *"   # every day, 7am Pacific (daylight time)
  workflow_dispatch:        # adds a "Run workflow" button for refreshing on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch listings
        run: python fetch_shows.py events.json
      - name: Commit if anything changed
        run: |
          git config user.name "shows-bot"
          git config user.email "shows-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Refresh shows $(date +%F)"
          git push
